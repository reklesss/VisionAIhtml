<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-бот VisionIAS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; height: 90vh; background: white; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .chat-header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.4; word-break: break-word; }
        .user-message { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot-message { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 0; }
        .message img { max-width: 100%; max-height: 200px; display: block; margin-top: 8px; border-radius: 4px; }
        .chat-input-area { padding: 15px; background: #f8f9fa; border-top: 1px solid #dee2e6; display: flex; flex-direction: column; gap: 10px; }
        .preview-container { display: none; position: relative; align-self: flex-start; }
        .preview-image { max-height: 80px; border-radius: 6px; border: 1px solid #ddd; }
        .remove-preview { position: absolute; top: -5px; right: -5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        textarea { flex: 1; resize: none; height: 45px; padding: 12px; border: 1px solid #ced4da; border-radius: 20px; outline: none; font-size: 14px; }
        .icon-btn { background: none; border: none; cursor: pointer; padding: 8px; font-size: 20px; color: #6c757d; transition: color 0.2s; }
        .icon-btn:hover { color: #007bff; }
        .send-btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .send-btn:hover { background: #0056b3; }
        .send-btn:disabled { background: #cccccc; cursor: not-allowed; }
        #file-input { display: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">VisionIAS Chatbot</div>
    <div class="chat-messages" id="chat-messages">
        <div class="message bot-message">Привет! Я готов принимать текст и изображения для анализа.</div>
    </div>
    
    <div class="chat-input-area">
        <div class="preview-container" id="preview-container">
            <img class="preview-image" id="preview-image" src="" alt="Preview">
            <button class="remove-preview" id="remove-preview" onclick="clearImagePreview()">&times;</button>
        </div>
        
        <div class="input-row">
            <label for="file-input" class="icon-btn" title="Прикрепить изображение">&#128247;</label>
            <input type="file" id="file-input" accept="image/*" onchange="handleImageSelect(event)">
            
            <textarea id="text-input" placeholder="Введите сообщение..." onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">Отправить</button>
        </div>
    </div>
</div>

<script>
    // Конфигурация зашита жестко и не подлежит изменению пользователем через UI
    const HF_TOKEN = "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"; 
    const MODEL_ID = "saurabhvisionias/visionias_model_v1";
    
    let selectedImageBase64 = null;

    function handleImageSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            selectedImageBase64 = e.target.result;
            document.getElementById('preview-image').src = selectedImageBase64;
            document.getElementById('preview-container').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    function clearImagePreview() {
        selectedImageBase64 = null;
        document.getElementById('file-input').value = '';
        document.getElementById('preview-container').style.display = 'none';
        document.getElementById('preview-image').src = '';
    }

    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function appendMessage(text, isUser, imageSrc = null) {
        const messagesContainer = document.getElementById('chat-messages');
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', isUser ? 'user-message' : 'bot-message');
        
        if (text) {
            const textSpan = document.createElement('span');
            textSpan.innerText = text;
            messageDiv.appendChild(textSpan);
        }
        
        if (imageSrc) {
            const img = document.createElement('img');
            img.src = imageSrc;
            messageDiv.appendChild(img);
        }
        
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function sendMessage() {
        const textInput = document.getElementById('text-input');
        const sendBtn = document.getElementById('send-btn');
        const text = textInput.value.trim();
        const currentImage = selectedImageBase64;

        if (!text && !currentImage) return;

        textInput.value = '';
        clearImagePreview();
        textInput.disabled = true;
        sendBtn.disabled = true;

        appendMessage(text, true, currentImage);

        const messagesContainer = document.getElementById('chat-messages');
        const loadingDiv = document.createElement('div');
        loadingDiv.classList.add('message', 'bot-message');
        loadingDiv.innerText = "Думаю...";
        messagesContainer.appendChild(loadingDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
            const contentArray = [];
            if (text) {
                contentArray.push({ type: "text", text: text });
            }
            if (currentImage) {
                contentArray.push({ 
                    type: "image_url", 
                    image_url: { url: currentImage } 
                });
            }

            const response = await fetch(`https://huggingface.co{MODEL_ID}/v1/chat/completions`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_ID,
                    messages: [
                        { role: "user", content: contentArray }
                    ],
                    max_tokens: 500
                })
            });

            const data = await response.json();
            loadingDiv.remove();

            if (data.choices && data.choices[0] && data.choices[0].message) {
                appendMessage(data.choices[0].message.content, false);
            } else if (data.error) {
                appendMessage(`Ошибка API: ${data.error}`, false);
            } else {
                appendMessage("Не удалось получить структурированный ответ от модели. Проверьте статус модели на Hugging Face.", false);
            }

        } catch (error) {
            loadingDiv.remove();
            appendMessage(`Ошибка сети: ${error.message}`, false);
        } finally {
            textInput.disabled = false;
            sendBtn.disabled = false;
            textInput.focus();
        }
    }
</script>

</body>
</html>
